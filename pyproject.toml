[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-ilink"
version = "0.1.0"
description = "codex-wechat-bot: a WeChat bot bridge for Codex built on the unofficial iLink HTTP protocol. For personal/educational use only."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
    "pycryptodome>=3.19",
    "qrcode[pil]>=7.4",
    "openai-codex>=0.144.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["wechat_ilink", "src"]
